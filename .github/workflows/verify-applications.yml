name: Verify targeted portfolio
on:
  push:
    branches: [feat/targeted-applications-2026-10]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format changed source and commit corrections
        run: |
          pnpm exec biome check --write src/pages/SvgEditorPage.tsx src/pages/TargetedApplicationPage.tsx src/routes/routes.tsx
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/SvgEditorPage.tsx src/pages/TargetedApplicationPage.tsx src/routes/routes.tsx
            git commit -m "style: format target portfolio files"
            git push
          fi
      - run: pnpm check
      - run: pnpm build
      - run: test -f dist/apply/clipy/index.html
      - run: test -f dist/apply/orinu/index.html
      - run: test -f dist/apply/orinu/editor/index.html
