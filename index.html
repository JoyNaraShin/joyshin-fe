<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>신나라 — 프론트엔드 개발자</title>
    <meta
      name="description"
      content="프론트엔드 개발자 신나라. CLO-SET에서 수만 건 목록의 가상화, 워크룸 첫 화면 LCP 44% 단축, 서버 상태와 클라이언트 상태를 나누는 구조 전환을 주도했습니다."
    />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="신나라 — 프론트엔드 개발자" />
    <meta
      property="og:description"
      content="대량 목록 렌더링과 복잡한 클라이언트 상태 관리에 강점이 있는 프론트엔드 개발자."
    />
    <meta name="theme-color" content="#ffffff" />
    <link rel="canonical" href="https://joynarashin.github.io/joyshin-fe/" />
    <meta property="og:url" content="https://joynarashin.github.io/joyshin-fe/" />
    <!-- 슬랙·팀즈로 링크를 돌리면 카드가 뜬다. 이미지가 없으면 텍스트 줄만 남는다. -->
    <meta property="og:image" content="https://joynarashin.github.io/joyshin-fe/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="신나라 포트폴리오. 워크룸 LCP 44% 단축, DOMContentLoaded 46% 단축, 수만 건 목록 가상화, CLO-SET 4년 1개월" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='4' fill='%230A5C5C'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='17' font-weight='600' fill='%23fff' text-anchor='middle'%3E%EC%8B%A0%3C/text%3E%3C/svg%3E"
    />
    <!-- 본문 굵기만 미리 받는다. 나머지 굵기는 스타일시트가 font-display:swap 으로 뒤따라 받는다. -->
    <link
      rel="preload"
      href="%BASE_URL%fonts/sans-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      #skip-link { position: absolute; top: 0; left: -999px; }
      #skip-link:focus { left: 0; }
    </style>
  </head>
  <body>
    <!-- 스킵 링크. 초점을 받기 전에는 화면 밖에 둔다. 색을 직접 주는 것은 base 의
         a{color:inherit} 에 지면 대비가 2.41:1 로 떨어지기 때문이다.
         위치만 head 인라인으로 못박는다 — 유틸리티 클래스로만 숨기면 CSS 가 붙기 전
         첫 페인트에 "본문 바로가기"가 잠깐 보였다 사라진다(dev 서버에서 실측). -->
    <a
      id="skip-link"
      href="#main"
      class="z-200 rounded-br-sm bg-mark px-4 py-2.5 font-semibold text-surface no-underline"
      >본문 바로가기</a
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
